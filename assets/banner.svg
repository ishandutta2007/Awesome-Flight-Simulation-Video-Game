<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#101f42"/>
      <stop offset="100%" stop-color="#070b19"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    
    <linearGradient id="jetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#00ffcc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes horizonTilt {
      0% { transform: rotate(-2deg) translateY(0px); }
      50% { transform: rotate(2deg) translateY(-8px); }
      100% { transform: rotate(-2deg) translateY(0px); }
    }

    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes jetFly1 {
      0% { transform: translate(-100px, 220px) scale(0.7) rotate(-5deg); opacity: 0; }
      10% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translate(1280px, 60px) scale(0.7) rotate(-12deg); opacity: 0; }
    }

    @keyframes jetFly2 {
      0% { transform: translate(-120px, 80px) scale(0.5) rotate(8deg); opacity: 0; }
      15% { opacity: 0.5; }
      85% { opacity: 0.5; }
      100% { transform: translate(1300px, 240px) scale(0.5) rotate(2deg); opacity: 0; }
    }

    @keyframes pulseTarget {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }

    @keyframes hudDataStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(-15px); opacity: 0.7; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }

    .horizon-line {
      animation: horizonTilt 12s ease-in-out infinite;
      transform-origin: center;
    }

    .radar-sweep-circle {
      animation: radarSpin 8s linear infinite;
      transform-origin: 1050px 150px;
    }

    .jet-path-1 {
      animation: jetFly1 14s ease-in-out infinite;
    }

    .jet-path-2 {
      animation: jetFly2 18s ease-in-out infinite;
      animation-delay: 4s;
    }

    .target-box {
      animation: pulseTarget 3s ease-in-out infinite;
      transform-origin: center;
    }

    .hud-line {
      stroke-dasharray: 20 10 5 10;
      animation: hudDataStream 20s linear infinite;
    }

    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="12"/>

  <!-- Background Grid (Flight Sim HUD / Map feel) -->
  <g opacity="0.08" stroke="#00ffcc" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" />
    <path d="M 100,0 L 100,300 M 200,0 L 200,300 M 300,0 L 300,300 M 400,0 L 400,300 M 500,0 L 500,300 M 600,0 L 600,300 M 700,0 L 700,300 M 800,0 L 800,300 M 900,0 L 900,300 M 1000,0 L 1000,300 M 1100,0 L 1100,300" />
  </g>

  <!-- Animated Artificial Horizon / Pitch Ladder (Right Background) -->
  <g class="horizon-line" opacity="0.25">
    <line x1="800" y1="150" x2="1150" y2="150" stroke="#00d2ff" stroke-width="2" stroke-dasharray="150 20 150"/>
    <!-- Pitch Markers -->
    <path d="M 920,110 L 950,110 L 950,120 M 1000,120 L 1000,110 L 1030,110" stroke="#00d2ff" stroke-width="2" fill="none"/>
    <path d="M 900,70 L 940,70 L 940,85 M 1010,85 L 1010,70 L 1050,70" stroke="#00d2ff" stroke-width="2" fill="none"/>
    <path d="M 920,190 L 950,190 L 950,180 M 1000,180 L 1000,190 L 1030,190" stroke="#00d2ff" stroke-width="2" fill="none"/>
    <path d="M 900,230 L 940,230 L 940,215 M 1010,215 L 1010,230 L 1050,230" stroke="#00d2ff" stroke-width="2" fill="none"/>
  </g>

  <!-- Animated Radar Screen (Far Right Background) -->
  <g transform="translate(0, 0)" opacity="0.35">
    <circle cx="1050" cy="150" r="110" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="1050" cy="150" r="75" fill="none" stroke="#00ffcc" stroke-width="1"/>
    <circle cx="1050" cy="150" r="40" fill="none" stroke="#00ffcc" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1050" y1="35" x2="1050" y2="265" stroke="#00ffcc" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="935" y1="150" x2="1165" y2="150" stroke="#00ffcc" stroke-width="1" stroke-opacity="0.5"/>
    
    <!-- Rotating Radar Sweep -->
    <g class="radar-sweep-circle">
      <path d="M 1050,150 L 1150,110 A 110 110 0 0 0 1050,40 Z" fill="url(#radarSweep)"/>
      <line x1="1050" y1="150" x2="1150" y2="110" stroke="#00ffcc" stroke-width="1.5" opacity="0.8"/>
    </g>
    
    <!-- Radar Blips -->
    <circle cx="1090" cy="110" r="3" fill="#38ef7d" filter="url(#subtleGlow)" class="particle"/>
    <circle cx="1020" cy="180" r="2.5" fill="#38ef7d" filter="url(#subtleGlow)" class="particle" style="animation-delay: 1.5s;"/>
    <circle cx="1060" cy="80" r="3.5" fill="#00d2ff" filter="url(#subtleGlow)" class="particle" style="animation-delay: 0.8s;"/>
  </g>

  <!-- Target Acquisition Reticle (Middle Right Background) -->
  <g class="target-box" transform="translate(850, 160)" opacity="0.5">
    <path d="M -20,-20 L -10,-20 M -20,-20 L -20,-10" stroke="#00ffcc" stroke-width="2" fill="none"/>
    <path d="M 20,-20 L 10,-20 M 20,-20 L 20,-10" stroke="#00ffcc" stroke-width="2" fill="none"/>
    <path d="M -20,20 L -10,20 M -20,20 L -20,10" stroke="#00ffcc" stroke-width="2" fill="none"/>
    <path d="M 20,20 L 10,20 M 20,20 L 20,10" stroke="#00ffcc" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="4" fill="#00ffcc"/>
    <text x="28" y="4" fill="#00ffcc" font-family="monospace" font-size="10" letter-spacing="1">LOCK 0.98</text>
  </g>

  <!-- Flying Jets & Contrails (Dynamic Elements crossing background) -->
  <!-- Jet 1 (Primary High Speed Fighter silhouette) -->
  <g class="jet-path-1">
    <!-- Contrail -->
    <path d="M -300,45 Q -150,30 0,0" stroke="rgba(0, 210, 255, 0.4)" stroke-width="3" fill="none" filter="url(#glow)"/>
    <path d="M -300,45 Q -150,30 0,0" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.5" fill="none"/>
    <!-- Jet Silhouette -->
    <path d="M 0,0 L -25,-12 L -18,-4 L -40,-6 L -48,-18 L -52,-18 L -46,-4 L -65,-2 L -72,-10 L -76,-10 L -72,0 L -76,10 L -72,10 L -65,2 L -46,4 L -52,18 L -48,18 L -40,6 L -18,4 L -25,12 Z" fill="url(#jetGrad)" filter="url(#subtleGlow)"/>
  </g>

  <!-- Jet 2 (Secondary Stealth Silhouette) -->
  <g class="jet-path-2">
    <!-- Contrail -->
    <path d="M -250,-20 Q -100,-10 0,0" stroke="rgba(56, 239, 125, 0.3)" stroke-width="2" fill="none"/>
    <!-- Stealth Fighter Silhouette -->
    <path d="M 0,0 L -30,-18 L -22,-5 L -45,-3 L -60,-15 L -64,-15 L -55,0 L -64,15 L -60,15 L -45,3 L -22,5 L -30,18 Z" fill="#00ffcc" opacity="0.6"/>
  </g>

  <!-- HUD Decorative Compass / Header Tape (Top Center) -->
  <g opacity="0.3" transform="translate(350, 25)">
    <line x1="0" y1="0" x2="500" y2="0" stroke="#00d2ff" stroke-width="1.5" class="hud-line"/>
    <path d="M 50,0 L 50,8 M 100,0 L 100,5 M 150,0 L 150,8 M 200,0 L 200,5 M 250,0 L 250,12 M 300,0 L 300,5 M 350,0 L 350,8 M 400,0 L 400,5 M 450,0 L 450,8" stroke="#00d2ff" stroke-width="1"/>
    <text x="242" y="24" fill="#00d2ff" font-family="monospace" font-size="11" font-weight="bold">360° N</text>
  </g>

  <!-- Atmospheric / Flight Data Overlay Marks (Left Side HUD) -->
  <g opacity="0.3" transform="translate(40, 60)" font-family="monospace" font-size="10" fill="#00ffcc">
    <text x="0" y="0">ALT: 36,000 FT</text>
    <text x="0" y="18">SPD: MACH 2.2</text>
    <text x="0" y="36">HDG: 045° NE</text>
    <text x="0" y="54">AOA: +4.2°</text>
    <line x1="0" y1="65" x2="110" y2="65" stroke="#00ffcc" stroke-width="1" opacity="0.5"/>
    <text x="0" y="80">SYS: ONLINE</text>
    <text x="0" y="98">FDM: JSBSim 6DoF</text>
  </g>

  <!-- FOREGROUND / TEXT CONTENT (Guaranteed High Contrast & Unobstructed) -->
  <!-- Dark Vignette behind text to guarantee zero obstruction from dynamic background elements -->
  <rect x="55" y="65" width="720" height="175" rx="10" fill="#0a1128" fill-opacity="0.65" filter="url(#glow)"/>

  <!-- Left Accent Flight Control Line -->
  <path d="M 65,85 L 65,215" stroke="url(#titleGrad)" stroke-width="4" stroke-linecap="round" filter="url(#subtleGlow)"/>

  <!-- Main Title -->
  <text x="85" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" fill="url(#titleGrad)" filter="url(#subtleGlow)" letter-spacing="0.5">
    Awesome Flight Simulation
  </text>

  <!-- Subtitle Line 1 -->
  <text x="86" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#ffffff" opacity="0.95" letter-spacing="0.2">
    Curated Commercial Games &amp; Open-Source Flight Simulators
  </text>

  <!-- Subtitle Line 2 / Badges representation -->
  <g transform="translate(86, 192)">
    <!-- Tech Tags / Badges -->
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#11998e" fill-opacity="0.3" stroke="#38ef7d" stroke-width="1"/>
    <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#38ef7d">✈️ Realistic Dynamics</text>

    <rect x="175" y="0" width="135" height="24" rx="12" fill="#00d2ff" fill-opacity="0.2" stroke="#00d2ff" stroke-width="1"/>
    <text x="187" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#00d2ff">🔓 Open-Source</text>

    <rect x="320" y="0" width="145" height="24" rx="12" fill="#3a7bd5" fill-opacity="0.25" stroke="#3a7bd5" stroke-width="1"/>
    <text x="332" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#a1c4fd">🌐 Web &amp; Desktop</text>
  </g>
</svg>
