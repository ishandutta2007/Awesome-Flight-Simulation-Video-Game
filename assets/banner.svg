<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a1128"/><stop offset="50%" stop-color="#101f42"/><stop offset="100%" stop-color="#070b19"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38ef7d"/><stop offset="50%" stop-color="#11998e"/><stop offset="100%" stop-color="#00d2ff"/></linearGradient><linearGradient id="jetGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00d2ff"/><stop offset="100%" stop-color="#3a7bd5"/></linearGradient><radialGradient id="radarSweep" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0fc" stop-opacity=".3"/><stop offset="70%" stop-color="#0fc" stop-opacity=".05"/><stop offset="100%" stop-color="#0fc" stop-opacity="0"/></radialGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes horizonTilt{0%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-8px)}}@keyframes radarSpin{0%{transform:rotate(0deg)}}@keyframes jetFly1{0%{transform:translate(-100px,220px) scale(.7) rotate(-5deg);opacity:0}10%,80%{opacity:.8}}@keyframes jetFly2{0%{transform:translate(-120px,80px) scale(.5) rotate(8deg);opacity:0}15%,85%{opacity:.5}}@keyframes pulseTarget{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.15);opacity:.9}}@keyframes hudDataStream{0%{stroke-dashoffset:400}}@keyframes floatParticle{0%{transform:translateY(0);opacity:.2}50%{transform:translateY(-15px);opacity:.7}}.horizon-line{animation:horizonTilt 12s ease-in-out infinite;transform-origin:center}.radar-sweep-circle{animation:radarSpin 8s linear infinite;transform-origin:1050px 150px}.jet-path-1{animation:jetFly1 14s ease-in-out infinite}.jet-path-2{animation:jetFly2 18s ease-in-out infinite;animation-delay:4s}.target-box{animation:pulseTarget 3s ease-in-out infinite;transform-origin:center}.hud-line{stroke-dasharray:20 10 5 10;animation:hudDataStream 20s linear infinite}.particle{animation:floatParticle 4s ease-in-out infinite}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="12"/><g stroke="#0fc" stroke-width="1" opacity=".08"><path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250"/><path d="M 100,0 L 100,300 M 200,0 L 200,300 M 300,0 L 300,300 M 400,0 L 400,300 M 500,0 L 500,300 M 600,0 L 600,300 M 700,0 L 700,300 M 800,0 L 800,300 M 900,0 L 900,300 M 1000,0 L 1000,300 M 1100,0 L 1100,300"/></g><g class="horizon-line" opacity=".25"><line x1="800" x2="1150" y1="150" y2="150" stroke="#00d2ff" stroke-dasharray="150 20 150" stroke-width="2"/><path fill="none" stroke="#00d2ff" stroke-width="2" d="M 920,110 L 950,110 L 950,120 M 1000,120 L 1000,110 L 1030,110"/><path fill="none" stroke="#00d2ff" stroke-width="2" d="M 900,70 L 940,70 L 940,85 M 1010,85 L 1010,70 L 1050,70"/><path fill="none" stroke="#00d2ff" stroke-width="2" d="M 920,190 L 950,190 L 950,180 M 1000,180 L 1000,190 L 1030,190"/><path fill="none" stroke="#00d2ff" stroke-width="2" d="M 900,230 L 940,230 L 940,215 M 1010,215 L 1010,230 L 1050,230"/></g><g opacity=".35" transform="translate(0, 0)"><circle cx="1050" cy="150" r="110" fill="none" stroke="#0fc" stroke-dasharray="6 4" stroke-width="1.5"/><circle cx="1050" cy="150" r="75" fill="none" stroke="#0fc" stroke-width="1"/><circle cx="1050" cy="150" r="40" fill="none" stroke="#0fc" stroke-dasharray="4 4" stroke-width="1"/><line x1="1050" x2="1050" y1="35" y2="265" stroke="#0fc" stroke-opacity=".5" stroke-width="1"/><line x1="935" x2="1165" y1="150" y2="150" stroke="#0fc" stroke-opacity=".5" stroke-width="1"/><g class="radar-sweep-circle"><path fill="url(#radarSweep)" d="M 1050,150 L 1150,110 A 110 110 0 0 0 1050,40 Z"/><line x1="1050" x2="1150" y1="150" y2="110" stroke="#0fc" stroke-width="1.5" opacity=".8"/></g><circle cx="1090" cy="110" r="3" fill="#38ef7d" class="particle" filter="url(#subtleGlow)"/><circle cx="1020" cy="180" r="2.5" fill="#38ef7d" class="particle" filter="url(#subtleGlow)" style="animation-delay:1.5s"/><circle cx="1060" cy="80" r="3.5" fill="#00d2ff" class="particle" filter="url(#subtleGlow)" style="animation-delay:.8s"/></g><g class="target-box" opacity=".5" transform="translate(850, 160)"><path fill="none" stroke="#0fc" stroke-width="2" d="M -20,-20 L -10,-20 M -20,-20 L -20,-10"/><path fill="none" stroke="#0fc" stroke-width="2" d="M 20,-20 L 10,-20 M 20,-20 L 20,-10"/><path fill="none" stroke="#0fc" stroke-width="2" d="M -20,20 L -10,20 M -20,20 L -20,10"/><path fill="none" stroke="#0fc" stroke-width="2" d="M 20,20 L 10,20 M 20,20 L 20,10"/><circle cx="0" cy="0" r="4" fill="#0fc"/><text x="28" y="4" fill="#0fc" font-family="monospace" font-size="10" letter-spacing="1">LOCK 0.98</text></g><g class="jet-path-1"><path fill="none" stroke="rgba(0, 210, 255, 0.4)" stroke-width="3" d="M -300,45 Q -150,30 0,0" filter="url(#glow)"/><path fill="none" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.5" d="M -300,45 Q -150,30 0,0"/><path fill="url(#jetGrad)" d="M 0,0 L -25,-12 L -18,-4 L -40,-6 L -48,-18 L -52,-18 L -46,-4 L -65,-2 L -72,-10 L -76,-10 L -72,0 L -76,10 L -72,10 L -65,2 L -46,4 L -52,18 L -48,18 L -40,6 L -18,4 L -25,12 Z" filter="url(#subtleGlow)"/></g><g class="jet-path-2"><path fill="none" stroke="rgba(56, 239, 125, 0.3)" stroke-width="2" d="M -250,-20 Q -100,-10 0,0"/><path fill="#0fc" d="M 0,0 L -30,-18 L -22,-5 L -45,-3 L -60,-15 L -64,-15 L -55,0 L -64,15 L -60,15 L -45,3 L -22,5 L -30,18 Z" opacity=".6"/></g><g opacity=".3" transform="translate(350, 25)"><line x1="0" x2="500" y1="0" y2="0" stroke="#00d2ff" stroke-width="1.5" class="hud-line"/><path stroke="#00d2ff" stroke-width="1" d="M 50,0 L 50,8 M 100,0 L 100,5 M 150,0 L 150,8 M 200,0 L 200,5 M 250,0 L 250,12 M 300,0 L 300,5 M 350,0 L 350,8 M 400,0 L 400,5 M 450,0 L 450,8"/><text x="242" y="24" fill="#00d2ff" font-family="monospace" font-size="11" font-weight="bold">360° N</text></g><g fill="#0fc" font-family="monospace" font-size="10" opacity=".3" transform="translate(40, 60)"><text x="0" y="0">ALT: 36,000 FT</text><text x="0" y="18">SPD: MACH 2.2</text><text x="0" y="36">HDG: 045° NE</text><text x="0" y="54">AOA: +4.2°</text><line x1="0" x2="110" y1="65" y2="65" stroke="#0fc" stroke-width="1" opacity=".5"/><text x="0" y="80">SYS: ONLINE</text><text x="0" y="98">FDM: JSBSim 6DoF</text></g><rect width="720" height="175" x="55" y="65" fill="#0a1128" fill-opacity=".65" filter="url(#glow)" rx="10"/><path stroke="url(#titleGrad)" stroke-linecap="round" stroke-width="4" d="M 65,85 L 65,215" filter="url(#subtleGlow)"/><text x="85" y="130" fill="url(#titleGrad)" filter="url(#subtleGlow)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing=".5">Awesome Flight Simulation</text><text x="86" y="170" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing=".2" opacity=".95">Curated Commercial Games &amp; Open-Source Flight Simulators</text><g transform="translate(86, 192)"><rect width="165" height="24" x="0" y="0" fill="#11998e" fill-opacity=".3" stroke="#38ef7d" stroke-width="1" rx="12"/><text x="12" y="16" fill="#38ef7d" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">✈️ Realistic Dynamics</text><rect width="135" height="24" x="175" y="0" fill="#00d2ff" fill-opacity=".2" stroke="#00d2ff" stroke-width="1" rx="12"/><text x="187" y="16" fill="#00d2ff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">🔓 Open-Source</text><rect width="145" height="24" x="320" y="0" fill="#3a7bd5" fill-opacity=".25" stroke="#3a7bd5" stroke-width="1" rx="12"/><text x="332" y="16" fill="#a1c4fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">🌐 Web &amp; Desktop</text></g></svg>